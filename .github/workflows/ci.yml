name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The flagship rule: no credentials in the starter, ever.
      # Match full credential SHAPES (same as the CLI/server scanners), not
      # bare prefixes: a bare `sk-ant-` grep both false-positives on the literal
      # and matches this workflow's own pattern string (which turned the check
      # permanently red). Exclude .github so the scan never reads its patterns.
      - name: No leaked keys
        run: |
          if grep -rInE \
            'sk-ant-(api|oat)[0-9]{2}-[A-Za-z0-9_-]{24,}|sk-proj-[A-Za-z0-9_-]{24,}|sk-or-v1-[A-Za-z0-9]{32,}|sk-[A-Za-z0-9]{32,}|AIza[A-Za-z0-9_-]{35}' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github .; then
            echo "credential-looking string found"; exit 1
          fi

      - name: Build output is gitignored
        run: |
          grep -q '^dist-oc/' .gitignore
          test ! -e dist-oc || { echo "dist-oc/ must not be committed"; exit 1; }

      - name: Model strings agree (agent.toml vs src/agents/support-triage.ts)
        run: |
          m_toml=$(grep -E '^model' agent.toml | sed 's/.*= *"\(.*\)"/\1/')
          grep -q "model: '$m_toml'" src/agents/support-triage.ts \
            || { echo "model in src/agents/support-triage.ts != agent.toml ($m_toml)"; exit 1; }
